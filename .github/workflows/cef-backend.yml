# CAP-N77 — build + smoke the real CEF OSR browser-host backend.
#
# The backend links libcef and needs the pinned CEF **standard** SDK (headers +
# libcef.lib) plus libclang for bindgen, so it is heavy and runs on demand + when
# the browser-host crate or this workflow changes — not on every push. The
# default `ci.yml` builds the crate WITHOUT `--features cef` (the honest skeleton
# that exits 3), so day-to-day CI needs no SDK.
name: CEF backend (browser source)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/browser-host/**"
      - ".github/workflows/cef-backend.yml"

permissions:
  contents: read

concurrency:
  group: cef-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # CEF_MAJOR is deliberately NOT set here: scripts/fetch-cef-sdk.mjs reads
  # PINNED_CEF_MAJOR out of crates/encode/src/cef.rs, so the line CI builds
  # against and the line the shipped fetcher installs cannot drift.

jobs:
  build-cef-backend:
    name: build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Windows only: the renderer sandbox needs cef_sandbox.lib, a STATIC
      # library CEF builds against the static CRT (/MT), while Rust's MSVC
      # target defaults to /MD — mixing the two is a link error. Set at job
      # level so clippy and build agree and cargo does not rebuild between them.
      #
      # Scoping it here is safe: the `cef` feature is built by this workflow
      # alone. The workspace build and the release bundle compile the skeleton
      # host, which links no static library and keeps the default CRT.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Pin our own Node. The macOS runner's preinstalled Homebrew node@24 is
      # broken against the system SQLite and aborts on startup:
      #   dyld: Symbol not found: _sqlite3_load_extension
      #     Referenced from: .../node@24/24.18.0/lib/libnode.137.dylib
      #     Expected in: /usr/lib/libsqlite3.dylib
      # which killed `node scripts/fetch-cef-sdk.mjs` with SIGABRT (exit 134)
      # before it could do anything.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux prerequisites
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/linux-deps
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # libclang for bindgen (the CEF C API bindings). Prebuilt, cached by the OS.
      #
      # BUILD-TIME ONLY — LLVM (~1 GB) is a host tool for this job and is NEVER
      # redistributed: bindgen emits plain Rust into OUT_DIR, so the compiled
      # host has no LLVM linkage. This job deliberately has `contents: read` and
      # NO upload-artifact step, and the release path (release.yml) neither
      # installs LLVM nor builds `--features cef`. Do not add an upload here.
      - name: Install LLVM/Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          cached: true

      # Resolve libclang ONCE for every later step (build.rs runs bindgen in
      # both the clippy and the build step).
      #
      # The trap this replaces: `export LIBCLANG_PATH="${LIBCLANG_PATH:-}"`.
      # Exporting it EMPTY is strictly worse than leaving it unset — bindgen
      # treats "" as a search path it was explicitly given, reports it as
      # invalid, and then refuses to fall back to the normal system lookup, so
      # every job died with "Unable to find libclang … (invalid: [])".
      # Only export a directory that DEMONSTRABLY holds the library. clang-sys
      # reports the paths it examined and rejected; `invalid: []` — an empty
      # list — means it looked at a directory with no candidate files in it at
      # all, which is what `$LLVM_PATH/lib` turned out to be on these runners.
      # `llvm-config --libdir` is the authoritative answer, so ask it first.
      - name: Resolve LIBCLANG_PATH
        shell: bash
        run: |
          set -u
          case "${{ matrix.os }}" in
            windows-latest) pattern='libclang.dll' ;;
            macos-latest)   pattern='libclang*.dylib' ;;
            *)              pattern='libclang.so*' ;;
          esac

          holds_libclang() {
            [ -n "${1:-}" ] && [ -d "$1" ] && \
              find "$1" -maxdepth 1 -name "$pattern" -print -quit | grep -q .
          }

          candidates=""
          if command -v llvm-config >/dev/null 2>&1; then
            candidates="$candidates $(llvm-config --libdir 2>/dev/null || true)"
          fi
          candidates="$candidates ${LIBCLANG_PATH:-} ${LLVM_PATH:-}/lib ${LLVM_PATH:-}/bin"
          candidates="$candidates /usr/lib/llvm-18/lib /usr/lib/llvm-17/lib /usr/lib/x86_64-linux-gnu"
          candidates="$candidates /opt/homebrew/opt/llvm/lib /usr/local/opt/llvm/lib"

          found=""
          for dir in $candidates; do
            if holds_libclang "$dir"; then found="$dir"; break; fi
          done

          if [ -n "$found" ]; then
            echo "LIBCLANG_PATH=$found" >> "$GITHUB_ENV"
            echo "libclang found in: $found"
            find "$found" -maxdepth 1 -name "$pattern"
          else
            echo "::warning::no directory containing $pattern was found; leaving"
            echo "LIBCLANG_PATH unset so bindgen still gets its own lookup."
            echo "Searched:"; for dir in $candidates; do echo "  - $dir"; done
          fi

      # Resolve + fetch + verify the pinned CEF **standard** dist (headers +
      # Release/libcef.lib), then export CEF_ROOT for build.rs. The resolver is
      # the same CDN index the app's fetcher pins to.
      - name: Fetch + stage the pinned CEF SDK
        shell: bash
        run: node scripts/fetch-cef-sdk.mjs

      # What the dist actually contains. The Windows build reported
      # `cef_sandbox.lib is not in …/Release`, and whether the renderer sandbox
      # can be enabled at all hinges on that one file — so list it rather than
      # keep guessing which distribution carries it.
      - name: Inventory the staged SDK
        shell: bash
        run: |
          echo "--- .cef-sdk ---"
          ls -la .cef-sdk 2>/dev/null || true
          echo "--- .cef-sdk/Release ---"
          ls -la .cef-sdk/Release 2>/dev/null | head -40 || true
          echo "--- any cef_sandbox anywhere in the dist ---"
          find .cef-sdk -iname '*sandbox*' 2>/dev/null || echo "  (none)"

      - name: Clippy the CEF backend
        shell: bash
        run: |
          export CEF_ROOT="$PWD/.cef-sdk"
          cargo clippy -p freally-browser-host --features cef --all-targets -- -D warnings

      - name: Build the CEF backend
        shell: bash
        run: |
          export CEF_ROOT="$PWD/.cef-sdk"
          cargo build -p freally-browser-host --features cef --release

      # A headless smoke: render a data: URL for a moment and assert the FBH1
      # header + at least one frame come out. Linux needs a virtual display.
      - name: Smoke — render + FBH1 header (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export CEF_ROOT="$PWD/.cef-sdk"
          cp "$CEF_ROOT"/Release/*.so "$CEF_ROOT"/Release/*.bin target/release/ 2>/dev/null || true
          cp -r "$CEF_ROOT"/Resources/* target/release/ 2>/dev/null || true
          # Linux's loader does NOT search the executable's own directory, so
          # copying libcef.so next to the binary is not enough on its own — the
          # host linked fine and then died at startup with
          #   error while loading shared libraries: libcef.so: cannot open
          #   shared object file
          # Point the loader at both the SDK and the copy beside the binary.
          export LD_LIBRARY_PATH="$CEF_ROOT/Release:$PWD/target/release:${LD_LIBRARY_PATH:-}"
          xvfb-run -a node scripts/cef-smoke.mjs
